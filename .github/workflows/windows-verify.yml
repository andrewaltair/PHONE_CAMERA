name: PHONE_CAMERA Windows verification

on:
  push:
    branches: [codex/unified-windows-ci]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build native app and test
        shell: pwsh
        run: |
          cmake -S native/phone-camera/pc -B build/native -G 'Visual Studio 17 2022' -A x64 -DMYCAM_BUILD_TOOLS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/native --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/native -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Activate both cameras without registration
        shell: pwsh
        run: |
          $mf = Join-Path $env:GITHUB_WORKSPACE 'build/native/Release/MyCamVCam.dll'
          $dshow = Join-Path $env:GITHUB_WORKSPACE 'build/native/Release/MyCamVCamDShow.dll'
          cmake -S tests/native-activation -B build/activation -G 'Visual Studio 17 2022' -A x64 "-DPHONE_CAMERA_MF_DLL=$mf" "-DPHONE_CAMERA_DSHOW_DLL=$dshow"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/activation --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/activation -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer without running it
        shell: pwsh
        run: |
          & ./native/phone-camera/installer/build.ps1 -Version '1.5.1'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain setup briefly for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PHONE_CAMERA-windows-setup
          path: native/phone-camera/installer/output/PHONE_CAMERA-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
