name: PHONE_CAMERA checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-and-phone-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:phone

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and test Android companion
        working-directory: native/phone-camera
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Retain debug APK briefly for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PHONE_CAMERA-android-debug
          path: native/phone-camera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies on runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libavcodec-dev libavutil-dev libswscale-dev libusb-1.0-0-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Build and test Linux preview
        run: |
          cmake -S native/phone-camera/pc -B build/linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --parallel 2
          ctest --test-dir build/linux --output-on-failure
          (cd build/linux && cpack)
      - name: Retain Linux preview package briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PHONE_CAMERA-linux-preview
          path: build/linux/*.deb
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build native webcam and run tests
        shell: pwsh
        run: |
          cmake -S native/phone-camera/pc -B build/native -G 'Visual Studio 17 2022' -A x64 -DMYCAM_BUILD_TOOLS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/native --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/native -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Activate both camera classes without installing them
        shell: pwsh
        run: |
          $mf = Join-Path $env:GITHUB_WORKSPACE 'build/native/Release/MyCamVCam.dll'
          $dshow = Join-Path $env:GITHUB_WORKSPACE 'build/native/Release/MyCamVCamDShow.dll'
          cmake -S tests/native-activation -B build/native-activation -G 'Visual Studio 17 2022' -A x64 "-DPHONE_CAMERA_MF_DLL=$mf" "-DPHONE_CAMERA_DSHOW_DLL=$dshow"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/native-activation --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/native-activation -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows installer without installing it
        shell: pwsh
        run: |
          & ./native/phone-camera/installer/build.ps1 -Version '1.5.1'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain installer briefly for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PHONE_CAMERA-windows-setup
          path: native/phone-camera/installer/output/PHONE_CAMERA-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
