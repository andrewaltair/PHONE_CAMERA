# OPTIONAL OWNER EXAMPLE (not installed by PHONE_CAMERA): one v4l2loopback device at /dev/video10, named "PHONE_CAMERA". exclusive_caps=1
# makes apps list it only while PHONE_CAMERA writes to it, so browsers don't offer an empty camera.
# Copy/adapt only after checking that the module is not shared. The package never removes or rewrites another
# v4l2loopback file; if the module is already loaded with shared settings, use an explicit --device instead.
options v4l2loopback devices=1 video_nr=10 card_label=PHONE_CAMERA exclusive_caps=1
